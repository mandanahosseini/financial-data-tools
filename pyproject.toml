[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "financial-data-tools"
version = "0.1.0"
description = "Python toolkit for financial data processing and AI-ready workflows"
authors = [
    {name = "Mandana Hosseini"}
]
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "faker"
]


[tool.setuptools.packages.find]
where = ["src"]